<title>짠! 뒤죽박죽 세계, 뭘 봤지? · 디지털 도슨트</title>
<style>
:root{--hf:"Black Han Sans","Jua","Do Hyeon","Noto Sans KR",sans-serif;--hd:#232d35;--hdo:#c9e8da;--bg:#fafaf7;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#e3e3dc;--ac:#1f4fd8;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#d9f0e6;--hdo:#232d35;--bg:#141413;--fg:#efefe9;--mut:#a3a39b;--card:#1e1e1c;--line:#34342f;--ac:#8fb0ff;--acfg:#10141f}}
:root[data-theme="dark"]{--hd:#d9f0e6;--hdo:#232d35;--bg:#141413;--fg:#efefe9;--mut:#a3a39b;--card:#1e1e1c;--line:#34342f;--ac:#8fb0ff;--acfg:#10141f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:1.45rem;line-height:1.35;margin:.2rem 0 .3rem}
h2{font-size:1.25rem;line-height:1.4;margin:.4rem 0}
.mut{color:var(--mut);font-size:.9rem}
.ai-credit,.site-credit{display:flex;align-items:center;gap:5px;font-size:clamp(9px,3.25vw,11px);line-height:1.4;white-space:nowrap}
.ai-credit{margin:0 0 12px}
.site-credit{margin:24px 0 0;justify-content:center}
.ai-credit img,.site-credit img{width:14px;height:14px;flex:none;object-fit:contain}
a{color:var(--ac)}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card b{display:block;font-size:1.05rem}
.card > .mut{display:block}
body.home .card{position:relative;padding-left:58px}
body.home .studio-star{position:absolute;left:16px;top:50%;transform:translateY(-50%);margin-right:0}
.studio-star{display:inline-block;width:32px;height:32px;vertical-align:middle;margin-right:10px;background-image:url("studio-stars.png");background-repeat:no-repeat;background-size:540px 540px;flex-shrink:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.btns button,.btns select,.pbtn,.back-home{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;min-height:44px}
.btns .pri{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:700}
.btns :is(#play,#studio-play){background:var(--studio-color);color:#fff;border-color:#524a40;text-shadow:0 1px 2px #232d35;-webkit-text-stroke:.35px #232d35}
[data-studio="1"]{--studio-color:#4898f4}
[data-studio="2"]{--studio-color:#f66a70}
[data-studio="3"]{--studio-color:#fbd648}
[data-studio="4"]{--studio-color:#68c592}
audio{width:100%;margin:8px 0}
.desc{white-space:pre-line}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qrbox{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;break-inside:avoid}
.qrbox div.q{display:flex;justify-content:center;margin-bottom:8px}
.qrbox b{display:block}
.back{font-family:var(--hf);font-size:1.15rem;font-weight:400;text-decoration:none;color:var(--hd);text-shadow:2px 0 var(--hdo),-2px 0 var(--hdo),0 2px var(--hdo),0 -2px var(--hdo),1.5px 1.5px var(--hdo),-1.5px 1.5px var(--hdo),1.5px -1.5px var(--hdo),-1.5px -1.5px var(--hdo)}
.back-home{display:inline-flex;align-items:center;background:#fff;color:#000;border-color:#000;text-shadow:none}
.back-home:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.pbtn small{display:block;font-size:.8rem}
@media screen and (max-width:640px){
  .desc{word-break:keep-all;overflow-wrap:anywhere;line-height:1.85}
}
@media print{.back{text-shadow:none}}
@media print{.noprint{display:none!important}body{background:#fff}}

const STUDIOS = [
{id:"studio-1",name:"Play / Nonplay",artist:"최희원 스튜디오",intro:`최희원 작가와 함께한 Play / Nonplay 수업을 소개합니다.

작가는 돌멩이, 나뭇가지, 비누, 천 조각처럼 우리 주변에서 쉽게 발견할 수 있는 사물과 재료를 관찰하고 수집하며 작업합니다. 이번 수업은 단순히 재미있게 노는 것(Play)에 그치지 않고, 놀이 너머의 영역(Nonplay)에서 사물과 재료를 탐색하고 재해석하는 과정을 통해 아이들이 자신만의 시각을 발전시키는 시간이었습니다.

수업에서는 미리 주제나 재료를 정해 놓지 않고, 아이들 개개인의 관심사를 현실로 직접 꺼내어 보는 시간을 가지고자 했습니다. 아이들이 평소에는 접하기 어려웠던 다양한 기술도 스스로 배울 수 있도록 옆에서 안내했습니다. 이를테면 하드보드지를 커터칼로 자를 때 어떻게 하면 힘을 많이 들이지 않으면서도 깔끔하게 자를 수 있는지부터, 나무에 구멍을 뚫기 위해 드릴을 사용할 때 어떻게, 어느 방향으로 힘을 줘야 하는지까지. 무언가를 만들기 위해 필요한 여러 가지 방법을 아이들 스스로 탐색하며 작업을 이어 나갔습니다. 아이들이 처음 작가와 만나 이야기하며 세운 계획이다보니 완벽하지 않을 수는 있지만, 각자의 자리에서 할 수 있는 만큼 최대한 노력한 결과물들입니다.`},
{id:"studio-2",name:"내 눈동자에 귀 기울이기",artist:"박시연 스튜디오",intro:`박시연 작가와 함께한 내 눈동자에 귀 기울이기 수업을 소개합니다.

이 수업은 회화 작업과 독립 출판 만화 작업을 병행하는 작가 박시연(활동명: 명왕성)이 스스로에게도 질문이었던 두 매체 간의 공존을 커리큘럼으로 풀어낸 수업입니다. 이 수업은 개인 작품인 <조각 프로젝트>와 팀 작품인 <색깔 땅따먹기>로 나뉘어 진행되었습니다.

<조각 프로젝트>는 무작위로 찢거나 자른 모형지 조각에 기억나는 일상의 장면, 해 보고 싶은 일, 또는 상상해서 그리고 싶은 것들을 자유롭게 그린 뒤, 나중에 배열하고 싶은 대로 배열하여 붙여 완성하는 과정으로 진행되었습니다. 완성이 어떠한 형태로 될지는 물론이고, 당장 다음에는 어떤 조각을 만들지도 계획하지 않은 상태에서 작품이 완성되었습니다. 특정한 순서로 이미지가 나열되었을 때 이야기가 발생하는 만화 문법의 원리와 여러 가지 기법의 회화 제작 과정을 융합한 프로젝트입니다.

<색깔 땅따먹기>에서는 먼저 아이들이 각자 마음에 드는 색상의 물감을 한 가지만 고릅니다. 그 후 약 4m의 실크천을 따라 옆으로 나란히 서서 처음 30분 정도는 자신의 자리에서 팔이 닿는 곳까지만 그리고 싶은 것을 그립니다. 그 후, 정해져 있던 나와 타인의 영역을 침범하며 자유롭게 나의 색을 여기저기 침투시킵니다.

{id:"studio-3",name:"소리탐험대",artist:"이창희 스튜디오",intro:`이창희 작가와 함께한 소리탐험대 수업을 소개합니다.

  app.innerHTML = `<a class="eng-preview" href="${english ? './' : '?lang=en'}" lang="${english ? 'ko' : 'en'}" aria-label="${label("English", "한국어")}">${label("Eng", "한국어")}</a><p class="mut">${label("디지털 도슨트", "Digital Exhibition Guide")}</p><h1>${esc(EXHIBITION.title).replace("\n", "<br>")}</h1>
  <p class="mut">${esc(EXHIBITION.place)}</p>
  <p>${label("아래 목록에서 작품을 선택하세요.", "Choose an artwork from the list below.")}</p>
  ${english ? '<div class="btns"><a class="pbtn" href="#introduction">Introduction</a></div>' : ""}
  ${STUDIOS.map((s,i)=>`<a class="card" href="#${s.id}"><b><span class="studio-star" style="background-position:${["-217.5px -174px","-325px -181px","-332px -228.5px","-212px -228.5px"][i]}" aria-hidden="true"></span>${esc(s.name)}</b><span class="mut">${esc(s.artist)}</span></a>`).join("")}`;
}

function introduction(){
  app.innerHTML = `<p><a class="back back-home" href="#">← Home</a></p>
  <h2>Introduction</h2>
  <p><strong>${esc(EXHIBITION.title).replace("\n", "<br>")}</strong></p>
  <p>Dream Studio is a time when children visit artists' studios and experience firsthand where art is made. What did the children see in the artists' spaces? Not only the pencils, erasers, paints, and brushes they use at school and home, but also strange materials they'd never seen before, the artist-teachers' works that may or may not be finished, and objects that carried traces of the artists' lives. In that place, the children naturally sensed and experienced the artists' art and lives.</p>
  <p>The artists felt the same way. Just as the children observed a world that is diverse, complex, and sometimes higgledy-piggledy, the artists also rediscovered the innocence they had forgotten and found new artistic inspiration through the children's perspectives. Watching children find and create something in their own way, even when given the same materials and conditions at the same site and time, the artists encountered unexpected results every time.</p>
  <p>How many of these children will grow up to become artists? Statistically, it's possible that none of the 31 will. However, even if the children end up in work unrelated to art, we believe that if they keep the artist's way of seeing and thinking they gained through Dream Studio—exploring the world, asking questions, and trying to express themselves in their own way—then whatever kind of adults they become, they will live creative and joyful lives.</p>
  <p>French artist Robert Filliou said, "<span lang="fr">l'art est ce qui rend la vie plus intéressante que l'art.</span>" (Art is what makes life more interesting than art.) The higgledy-piggledy world that the children and artists viewed with interest through art at Dream Studio now unfolds in this exhibition. Ta-da!</p>`;
}

const artworkViewerIds = new Set(["w2","w3","w4","w5","w6","w7","w8","w9","w10","w12","w13","w14","w15","w16","w17","w18","w19","w20","w21","w22","w23","w24","w25","w26","w27","w28","w37","w38","w39","w40","w41","w42","w43","w44","w45","w46","w47","w48"]);

function artworkViewerHref(work){
  if (work.id === "w11") return "meonjakgwi.html" + (english ? "?lang=en" : "");
  const params = new URLSearchParams({id:work.id,title:work.title,artist:work.artist});
  if (english) params.set("lang", "en");
  return "artwork-viewer.html?" + params;
}

function work(w){
  const i = WORKS.indexOf(w);
  const prev = WORKS[i-1], next = WORKS[i+1];
  const nextStudio = next && next.s !== w.s ? STUDIOS[next.s-1] : null;
  const inlineArtwork = w.id === "w2" || w.id === "w4";
  const artworkLink = inlineArtwork
    ? `<button type="button" class="pbtn" id="inline-artwork-open" aria-haspopup="dialog">${label("작품 보기", "View artwork")}</button>`
    : w.id === "w11" || artworkViewerIds.has(w.id)
    ? `<a class="pbtn" href="${esc(artworkViewerHref(w))}">${label("작품 보기", "View artwork")}</a>`
    : "";
  app.innerHTML = `<p><a href="#${STUDIOS[w.s-1].id}">← ${esc(STUDIOS[w.s-1].name)}</a></p>
  <h2>${esc(w.title)}</h2><p class="mut">${esc(w.artist)}${w.g?" · "+esc(w.g):""}</p>
  ${!english || artworkLink ? `<div class="btns">${english ? "" : `<button class="pri" id="play" data-studio="${w.s}" aria-pressed="false">▶ 음성 재생</button>`}${artworkLink}</div>` : ""}
${english ? "" : `
  <p class="mut ai-credit">이 음성 안내는 AI 합성 음성으로 제작되었습니다.<img src="https://www.google.com/s2/favicons?domain=typecast.ai&amp;sz=64" alt="타입캐스트" width="14" height="14"></p>
  <p class="mut" id="audio-status" role="status"></p>`}
  <div class="desc">${esc(w.desc||label("작품 설명을 준비 중입니다.", "Artwork description coming soon."))}</div>
  <nav class="btns" aria-label="${label("작품 이동", "Artwork navigation")}">${prev?`<a class="pbtn" href="#${prev.id}">${label("← 이전 작품", "← Previous artwork")}${prev.s!==w.s?`<small>${esc(STUDIOS[prev.s-1].name)}</small>`:""}</a>`:""}${nextStudio?`<a class="pbtn" href="#${nextStudio.id}">${label("다음 스튜디오 소개 →", "Next studio →")}<small>${esc(nextStudio.name)}</small></a>`:next?`<a class="pbtn" href="#${next.id}">${label("다음 작품 →", "Next artwork →")}</a>`:""}</nav>`;
  if(w.id === "w4") attachArtworkViewer(w);
  if(w.id === "w2"){
    const open = document.getElementById("inline-artwork-open");
    const dialog = document.createElement("dialog");
    dialog.className = "inline-artwork";
    dialog.setAttribute("aria-label", w.title);
    dialog.innerHTML = `<button type="button" class="inline-artwork-close" autofocus>${label("사진 닫기", "Close photo")}</button>
      <img alt="${esc(w.title)}" draggable="false">
      <p role="status" hidden>${label("작품 사진을 불러오지 못했습니다.", "The artwork photo could not be loaded.")}</p>`;
    const photo = dialog.querySelector("img");
    photo.onerror = () => {
      photo.hidden = true;
      dialog.querySelector("[role=status]").hidden = false;
    };
    dialog.oncontextmenu = event => event.preventDefault();
    app.append(dialog);
    open.onclick = () => {
      if(!photo.hasAttribute("src")) photo.src = "art-w2.jpg";
      dialog.showModal();
    };
    dialog.querySelector("button").onclick = () => dialog.close();
    dialog.onclose = () => open.focus({preventScroll:true});
  }
  if(english) return;
  const button = document.getElementById("play");
  const status = document.getElementById("audio-status");
  let state = "idle";
  const setState = value => {
    state = value;
    button.textContent = value === "playing" ? "Ⅱ 일시정지" : value === "paused" ? "▶ 이어듣기" : "▶ 음성 재생";
    button.setAttribute("aria-pressed", value === "playing");
    const photoAudio = document.getElementById("photo-audio");
    if(photoAudio){
      photoAudio.textContent = button.textContent;
      photoAudio.setAttribute("aria-pressed", value === "playing");
    }
  };
  const fail = () => { setState("idle"); status.textContent = "음성을 재생하지 못했습니다. 다시 눌러 주세요."; };
  let audio = null;
  if(w.audio){
    audio = new Audio(w.audio);
    audio.onended = () => setState("idle");
    audio.onerror = fail;
  }
  button.onclick = async () => {
    status.textContent = "";
    if(audio){
      if(state === "playing"){ audio.pause(); setState("paused"); return; }
      activeAudio = audio;
      try { await audio.play(); setState("playing"); } catch(e){ fail(); }
      return;
    }
    if(!("speechSynthesis" in window)){ status.textContent = "이 기기는 음성 재생을 지원하지 않습니다."; return; }
    if(state === "playing"){ speechSynthesis.pause(); setState("paused"); return; }
    if(state === "paused"){ speechSynthesis.resume(); setState("playing"); return; }
    stopTTS();
    const token = aiTok;
    const utterance = new SpeechSynthesisUtterance(w.title + ". " + w.artist + " 작가의 작품입니다. " + (w.desc||""));
    const voices = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
    const voice = voices.find(v => /natural|neural|premium|enhanced|google|yuna|sun-?hi|heami/i.test(v.name)) || voices[0];
    if(voice) utterance.voice = voice;
    utterance.lang = "ko-KR";
    utterance.onend = () => { if(token === aiTok) setState("idle"); };
    utterance.onerror = () => { if(token === aiTok) fail(); };
    setState("playing");
    speechSynthesis.speak(utterance);
  };
}
function attachArtworkViewer(work){
  const opener = document.getElementById("inline-artwork-open");
  const dialog = document.createElement("dialog");
  dialog.className = "inline-artwork embedded-artwork";
  dialog.setAttribute("aria-label", work.title);
  dialog.innerHTML = `<div class="embedded-artwork-controls">
    ${english ? "" : '<button type="button" id="photo-audio" aria-pressed="false">▶ 음성 재생</button>'}
    <button type="button" id="photo-close" autofocus>${label("사진 닫기", "Close photo")}</button>
  </div><iframe title="${esc(work.title)}"></iframe>`;
  const frame = dialog.querySelector("iframe");
  const photoAudio = dialog.querySelector("#photo-audio");
  const close = () => history.back();
  const onBack = () => {
    if(dialog.open) dialog.close();
  };
  frame.onload = () => {
    const back = frame.contentDocument?.getElementById("back");
    if(back) back.style.display = "none";
    frame.contentDocument?.addEventListener("keydown", event => {
      if(event.key === "Escape" && dialog.open){
        event.preventDefault();
        close();
      }
    });
  };
  frame.src = artworkViewerHref(work);
  app.append(dialog);
  if(photoAudio){
    photoAudio.onclick = () => document.getElementById("play").click();
  }
  opener.onclick = () => {
    history.pushState({artworkPhoto: work.id}, "");
    window.addEventListener("popstate", onBack, {once:true});
    dialog.showModal();
  };
  dialog.querySelector("#photo-close").onclick = close;
  dialog.oncancel = event => {
    event.preventDefault();
    close();
  };
  dialog.onclose = () => opener.focus({preventScroll:true});
}
function studio(s){
  const n = STUDIOS.indexOf(s)+1; let g = "";
  app.innerHTML = `<p><a class="back back-home" href="#">${label("← 메인화면", "← Home")}</a></p><h2>${esc(s.name)}</h2><p class="mut">${esc(s.artist)}</p><div class="btns">${english ? "" : `<button class="pri" id="studio-play" data-studio="${n}" aria-pressed="false">▶ 도슨트 음성 재생</button>`}<button id="jump-to-works" type="button">${label("↓ 작품 바로가기", "↓ Jump to artworks")}</button></div>${english ? "" : `<p class="mut ai-credit">이 음성 안내는 AI 합성 음성으로 제작되었습니다.<img src="https://www.google.com/s2/favicons?domain=typecast.ai&amp;sz=64" alt="타입캐스트" width="14" height="14"></p><p id="studio-audio-status" class="mut" role="status"></p>`}<div class="desc">${esc(s.intro)}</div><h2 id="work-list-heading" tabindex="-1">${label("작품 목록", "Artworks")}</h2>`
  + WORKS.filter(w=>w.s===n).map(w=>{const h = w.g&&w.g!==label("조각 프로젝트", "Fragment Project")&&w.g!==g ? `<p class="mut">${esc(g=w.g)}</p>` : ""; return h+`<a class="card" href="#${w.id}"><b>${esc(w.title)}</b><span class="mut">${esc(w.artist)}</span></a>`;}).join("");
  document.getElementById("jump-to-works").onclick = () => {
    const heading = document.getElementById("work-list-heading");
    heading.focus({preventScroll:true});
    heading.scrollIntoView({behavior:reducedMotion.matches ? "auto" : "smooth",block:"start"});
  };
  if(!english){
    const audio = new Audio(`docent-studio-${n}.mp3`);
    audio.preload = "metadata";
    const button = document.getElementById("studio-play");
    const status = document.getElementById("studio-audio-status");
    let started = false;
    const update = playing => {
      button.textContent = playing ? "Ⅱ 일시정지" : started ? "▶ 이어듣기" : "▶ 도슨트 음성 재생";
      button.setAttribute("aria-pressed",playing);
    };
    audio.onended = () => { started=false; update(false); };
    audio.onerror = () => { update(false); status.textContent="음성을 불러오지 못했습니다. 다시 시도해 주세요."; };
    button.onclick = async () => {
      status.textContent="";
      if(!audio.paused){ audio.pause(); update(false); return; }
      activeAudio=audio;
      try{ await audio.play(); started=true; update(true); }
      catch(e){ update(false); status.textContent="음성을 재생하지 못했습니다. 다시 눌러 주세요."; }
    };
  }}

let qrLibrary;
function loadQrLibrary(){
  if(typeof QRCode !== "undefined") return Promise.resolve();
  if(!qrLibrary){
    qrLibrary = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
      script.onload = resolve;
      script.onerror = () => { script.remove(); reject(); };
      document.head.append(script);
    }).catch(error => { qrLibrary = null; throw error; });
  }
  return qrLibrary;
}
function qr(){
  let base = "";
  try{ base = localStorage.getItem("docentBase")||""; }catch(e){}
  const ITEMS = STUDIOS.map(s=>({id:s.id,title:s.name,artist:s.artist})).concat(WORKS);
  app.innerHTML = `<p class="noprint"><a href="#">← 돌아가기</a></p><h1>작품별 QR코드</h1>
  <p class="mut noprint">① 이 페이지의 공유(Share)에서 누구나 링크로 볼 수 있게 설정 → ② 복사한 공유 링크를 아래에 붙여넣기 → ③ QR 만들기 → ④ 인쇄. 링크를 붙여넣기 전에는 QR을 만들지 않습니다(휴대폰에서 열리지 않는 주소가 들어가는 것을 막기 위해서입니다).</p>
  <div class="btns noprint"><input id="bs" type="url" inputmode="url" placeholder="https://claude.ai/artifact/..." style="flex:1;min-width:220px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit"><button class="pri" id="mk">QR 만들기</button></div>
  <p id="bm" class="noprint" style="color:#c0392b;margin:0"></p>
  <div class="btns noprint"><button class="pri" onclick="window.print()">인쇄 / PDF 저장</button></div>
  <div class="qrgrid">${ITEMS.map(w=>`<div class="qrbox"><div class="q" id="q-${w.id}"></div><b>${esc(w.title)}</b><small>${esc(w.artist)}</small></div>`).join("")}</div>`;
  const bs = document.getElementById("bs"), bm = document.getElementById("bm"); bs.value = base;
  const build = async () => {
    const b = bs.value.trim().split("#")[0];
    if(!/^https?:\/\//.test(b)){ bm.textContent = "공유 링크(https://로 시작)를 붙여넣어 주세요."; return; }
    bm.textContent = "QR코드를 불러오는 중입니다.";
    try{ await loadQrLibrary(); }catch(e){ bm.textContent = "QR 라이브러리를 불러오지 못했습니다. 다시 시도해 주세요."; return; }
    if(!bs.isConnected) return;
    bm.textContent = ""; try{ localStorage.setItem("docentBase", b); }catch(e){}
    ITEMS.forEach(w=>{ const el = document.getElementById("q-"+w.id); el.innerHTML = ""; new QRCode(el,{text:b+"#"+w.id,width:160,height:160,correctLevel:QRCode.CorrectLevel.M}); });
  };
  document.getElementById("mk").onclick = build; if(base) build(); else loadQrLibrary().catch(()=>{});
}

function route(event){
  if(!english) stopTTS();
  document.body.style.removeProperty("--cover-progress");
  document.body.classList.remove("home");
  const h = location.hash.slice(1);
  const w = WORKS.find(x=>x.id===h);
  const s = STUDIOS.find(x=>x.id===h);
  if(h==="introduction" && english) introduction();
  else if(h==="qr" && !english) qr(); else if(s) studio(s); else if(w) work(w); else home();
  if(h !== "qr" || english){
    const footer = document.createElement("footer");
    footer.className = "mut site-credit";
    footer.innerHTML = `<span>${label("이 디지털 도슨트는 생성형 AI를 활용해 제작했습니다.", "Generative AI helped build this guide.")}</span><img src="https://www.google.com/s2/favicons?domain=chatgpt.com&amp;sz=64" alt="ChatGPT" width="14" height="14"><img src="https://www.google.com/s2/favicons?domain=claude.ai&amp;sz=64" alt="Claude" width="14" height="14">`;
    app.append(footer);
  }
  const previousId = event ? new URL(event.oldURL).hash.slice(1) : "";
  const previousWork = s && WORKS.find(item => item.id === previousId);
  const previousCard = previousWork && STUDIOS[previousWork.s-1] === s
    ? app.querySelector(`.card[href="#${previousWork.id}"]`) : null;
  if(previousCard){
    previousCard.scrollIntoView({block:"center"});
    previousCard.focus({preventScroll:true});
  }else{
    window.scrollTo(0,0);
    const heading = event && app.querySelector("h1,h2");
    if(heading){
      heading.tabIndex = -1;
      heading.focus({preventScroll:true});
    }
  }
}
let coverFrame = 0;
function queueCoverOpacity(){
  if(coverFrame) return;
  coverFrame = requestAnimationFrame(() => {
    coverFrame = 0;
    if(!document.body.classList.contains("home")) return;
    const available = document.documentElement.scrollHeight - window.innerHeight;
    const distance = Math.max(1, Math.min(available - 1, window.innerHeight * .45));
    const progress = Math.min(1, Math.max(0, window.scrollY / distance));
    document.body.style.setProperty("--cover-progress", progress.toFixed(3));
  });
}
window.addEventListener("scroll", queueCoverOpacity, {passive:true});
window.addEventListener("resize", queueCoverOpacity);
window.addEventListener("hashchange", route);
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
route();
queueCoverOpacity();
if(document.body.classList.contains("home")){
  requestAnimationFrame(() => {
    if(document.body.classList.contains("home") && window.scrollY === 0){
      if(reducedMotion.matches){
        app.scrollIntoView({behavior:"instant", block:"start"});
        return;
      }
      const duration = 3000;
      const started = performance.now();
      let previousY = window.scrollY;
      const animate = now => {
        if(!document.body.classList.contains("home") || Math.abs(window.scrollY - previousY) > 1) return;
        const progress = Math.min(1, (now - started) / duration);
        const targetY = previousY + app.getBoundingClientRect().top;
        const eased = progress * progress * (3 - 2 * progress);
        window.scrollTo({top:targetY * eased, behavior:"instant"});
        previousY = window.scrollY;
        if(progress < 1) requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    }
  });
}
