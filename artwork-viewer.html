<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작품 보기</title>
<style>
:root{--bg:#000;--fg:#e9e6df;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e9e6df}}
:root[data-theme="dark"]{--bg:#000;--fg:#e9e6df}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
img{display:block;width:auto;height:auto;max-width:94vw;max-height:calc(100dvh - 190px);filter:brightness(0);clip-path:inset(46% 49% 46% 49%)}
img.on{animation:light 3.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes light{
 0%{filter:brightness(0);clip-path:inset(46% 49% 46% 49%)}
 8%{filter:brightness(.45);clip-path:inset(46% 49% 46% 49%)}
 12%{filter:brightness(.1);clip-path:inset(46% 49% 46% 49%)}
 22%{filter:brightness(.6);clip-path:inset(44% 30% 44% 30%)}
 70%{filter:brightness(1);clip-path:inset(0 0 0 0)}
 100%{filter:brightness(1);clip-path:inset(0 0 0 0)}}
header{margin-top:30px;text-align:center;min-height:84px}
.c{display:inline-block;opacity:0;white-space:pre}
header.on .c{animation:wr .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(3.24s + var(--d))}
header.on i{animation:ln .9s ease forwards;animation-delay:4.44s}
@keyframes wr{from{opacity:0;transform:translateY(.5em);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes ln{to{transform:scaleX(1)}}
h1{font-size:24px;font-weight:300;margin:0;letter-spacing:.12em}
p{margin:14px 0 0;font-size:12px;letter-spacing:.2em;color:#9c9a94}header i{display:block;width:36px;height:1px;background:#6b6a66;margin:14px auto 0;transform:scaleX(0);transform-origin:center}
.pager button{font:inherit;font-size:12px;color:var(--fg);opacity:.55;background:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){img,img.on{animation:none;filter:none;clip-path:none}.c{opacity:1!important;animation:none!important}header i{transform:none}}
.back{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:1;display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 15px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 16px rgba(0,0,0,.24);font-size:12px;color:var(--fg);text-decoration:none}
.back:hover{background-color:rgba(255,255,255,.10)}
.back:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.pager{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center}
.pager[hidden]{display:none}
@media (max-height:360px){img{max-height:45dvh}header{margin-top:10px}}
</style>
</head>
<body>
<main>
  <img id="artwork" alt="">
  <p id="image-status" role="status" hidden></p>
  <header id="caption"><h1></h1><i aria-hidden="true"></i><p></p></header>
</main>
<a class="back" id="back" href="./">← 작품 설명</a>
<nav class="pager" id="pager" hidden>
  <button id="previous" type="button">←</button><output id="position"></output><button id="next" type="button">→</button>
</nav>
<script>
const photosByWork = {"w2":["art-w2.jpg"],"w3":["art-w3.jpg"],"w5":["art-w5.jpg","art-w5-2.jpg"],"w6":["art-w6.jpg"],"w7":["art-w7.jpg","art-w7-2.jpg"],"w8":["art-w8.jpg"],"w9":["art-w9.jpg"],"w10":["art-w10.jpg"],"w12":["art-w12.jpg"],"w13":["art-w13.jpg"],"w14":["art-w14.jpg"],"w15":["art-w15.jpg"],"w16":["art-w16.jpg"],"w17":["art-w17.jpg"],"w18":["art-w18.jpg"],"w19":["art-w19.jpg"],"w20":["art-w20.jpg"],"w21":["art-w21.jpg"],"w22":["art-w22.jpg"],"w23":["art-w22.jpg"],"w24":["art-w24.jpg"],"w25":["art-w24.jpg"],"w26":["art-w21.jpg"],"w27":["art-w27.jpg"],"w28":["art-w27.jpg"],"w37":["art-w37.jpg"],"w38":["art-w38.jpg"],"w39":["art-w39.jpg"],"w40":["art-w40.jpg"],"w41":["art-w41.jpg"],"w42":["art-w42.jpg"],"w43":["art-w41.jpg"],"w44":["art-w44.jpg"],"w45":["art-w45.jpg"],"w46":["art-w46.jpg"],"w47":["art-w47.jpg"],"w48":["art-w48.jpg","art-w48-2.jpg"],"w4":["art-w4.jpg","art-w4-2.jpg"]};
const photoCrops = {
  w21: [808, 163, 558, 550], // 알 수 없는 사람에게 드려요
  w22: [800, 160, 550, 560], // 숨어있는 감정들
  w23: [108, 154, 535, 563], // 바다 케이크
  w24: [139, 166, 529, 550], // 숲 속
  w25: [818, 178, 517, 535], // 눈사람만의 노을
  w26: [95, 185, 550, 520], // 비 오는 날
  w27: [109, 173, 537, 537], // 냉동 바다 창고
  w28: [808, 151, 580, 580], // 소리
};
const query = new URLSearchParams(location.search);
const workId = query.get('id');
const photos = photosByWork[workId];
const english = query.get('lang') === 'en';
const img = document.getElementById('artwork');
const caption = document.getElementById('caption');
const back = document.getElementById('back');
const imageStatus = document.getElementById('image-status');
const title = query.get('title') || (english ? 'View artwork' : '작품 보기');
const artist = query.get('artist') || '';
let current = 0;
let playback = 0;
let croppedPhoto;

if (!Array.isArray(photos)) {
  location.replace('./' + (english ? '?lang=en' : ''));
} else {
  document.documentElement.lang = english ? 'en' : 'ko';
  document.title = title;
  img.alt = title;
  back.href = './' + (english ? '?lang=en' : '') + '#' + workId;
  back.textContent = english ? '← Artwork description' : '← 작품 설명';
  setCaption(caption.querySelector('h1'), title, .16, 0);
  setCaption(caption.querySelector('p'), artist, .07, 1.5);

  const pager = document.getElementById('pager');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  pager.hidden = photos.length < 2;
  pager.setAttribute('aria-label', english ? 'Artwork photos' : '작품 사진');
  previous.setAttribute('aria-label', english ? 'Previous photo' : '이전 사진');
  next.setAttribute('aria-label', english ? 'Next photo' : '다음 사진');
  previous.onclick = () => show((current + photos.length - 1) % photos.length);
  next.onclick = () => show((current + 1) % photos.length);
  show(0);
}

function setCaption(element, text, step, start) {
  element.setAttribute('aria-label', text);
  [...text].forEach((character, index) => {
    const span = document.createElement('span');
    span.className = 'c';
    span.setAttribute('aria-hidden', 'true');
    span.style.setProperty('--d', (start + index * step).toFixed(2) + 's');
    span.textContent = character;
    element.append(span);
  });
}

async function show(index) {
  current = index;
  const token = ++playback;
  img.classList.remove('on');
  caption.classList.remove('on');
  imageStatus.hidden = true;
  document.getElementById('position').textContent = (index + 1) + ' / ' + photos.length;
  const filename = photos[index];
  const crop = photoCrops[workId];
  const source = croppedPhoto || filename;
  if (img.getAttribute('src') !== source) img.src = source;
  try {
    await img.decode();
    if (token !== playback) return;
    if (crop && !croppedPhoto) {
      const [x, y, width, height] = crop;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, x, y, width, height, 0, 0, width, height);
      croppedPhoto = canvas.toDataURL('image/png');
      img.src = croppedPhoto;
      await img.decode();
    }
  }
  catch {
    if (token === playback) {
      imageStatus.textContent = english ? 'The artwork photo could not be loaded.' : '작품 사진을 불러오지 못했습니다.';
      imageStatus.hidden = false;
    }
    return;
  }
  if (token !== playback) return;
  void img.offsetWidth;
  img.classList.add('on');
  caption.classList.add('on');
}
</script>
</body>
</html>
