<style>
:root{--bg:#000;--fg:#e9e6df;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#000;--fg:#e9e6df}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
img{display:block;width:auto;height:auto;max-width:94vw;max-height:calc(100dvh - 190px);filter:brightness(0);clip-path:inset(46% 49% 46% 49%)}
img.on{animation:light 3.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes light{
 0%{filter:brightness(0);clip-path:inset(46% 49% 46% 49%)}
 8%{filter:brightness(.45);clip-path:inset(46% 49% 46% 49%)}
 12%{filter:brightness(.1);clip-path:inset(46% 49% 46% 49%)}
 22%{filter:brightness(.6);clip-path:inset(44% 30% 44% 30%)}
 70%{filter:brightness(1);clip-path:inset(0 0 0 0)}
 100%{filter:brightness(1);clip-path:inset(0 0 0 0)}}
header{margin-top:30px;text-align:center;min-height:84px}
.c{display:inline-block;opacity:0;white-space:pre}
header.on .c{animation:wr .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(3.24s + var(--d))}
header.on i{animation:ln .9s ease forwards;animation-delay:4.44s}
@keyframes wr{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:none}}
@keyframes ln{to{transform:scaleX(1)}}
h1{font-size:24px;font-weight:300;margin:0;letter-spacing:.12em}

.pager button{font:inherit;font-size:12px;color:var(--fg);opacity:.55;background:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){img,img.on{animation:none;filter:none;clip-path:none}.c{opacity:1!important;animation:none!important}header i{transform:none}}

  next.onclick = () => show((current + 1) % photos.length);
  show(0);

function setCaption(element, text, step, start) {
  element.setAttribute('aria-label', text);
  [...text].forEach((character, index) => {
    const span = document.createElement('span');
    span.className = 'c';
    span.setAttribute('aria-hidden', 'true');
    span.style.setProperty('--d', (start + index * step).toFixed(2) + 's');
    span.textContent = character;
    element.append(span);
  });
}

async function show(index) {
  current = index;
  const token = ++playback;
  img.classList.remove('on');
  caption.classList.remove('on');
  imageStatus.hidden = true;
  document.getElementById('position').textContent = (index + 1) + ' / ' + photos.length;
  const filename = photos[index];
  const crop = photoCrops[workId];
  const source = croppedPhoto || filename;
  if (img.getAttribute('src') !== source) img.src = source;
  try {
    await img.decode();
    if (token !== playback) return;
    if (crop && !croppedPhoto) {
      const [x, y, width, height] = crop;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, x, y, width, height, 0, 0, width, height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (token !== playback) return;
      if (!blob) throw new Error('Artwork crop could not be encoded');
      croppedPhoto = URL.createObjectURL(blob);
      img.src = croppedPhoto;
      await img.decode();
    }
  }
  catch {
    if (token === playback) {
      imageStatus.textContent = english ? 'The artwork photo could not be loaded.' : '작품 사진을 불러오지 못했습니다.';
      imageStatus.hidden = false;
    }
    return;
  }
  if (token !== playback) return;
  img.classList.add('on');
  caption.classList.add('on');
}

  const stage = document.querySelector('.photo-stage');
  const artwork = stage.querySelector('img');
  const lens = document.createElement('div');
  const detail = document.createElement('div');
  lens.className = 'artwork-lens';
  detail.className = 'artwork-lens-detail';
  lens.hidden = true;
  lens.setAttribute('aria-hidden', 'true');
  lens.append(detail);
  document.body.append(lens);
  artwork.tabIndex = 0;

  const zoom = 2.6;
  let point;
  let frame = 0;
  let activeTouch = null;
  let source;
  let radius;
  const bound = (value, min, max) => Math.min(Math.max(value, min), max);

  function hide() {
    point = null;
    lens.hidden = true;
  }

  function render() {
    frame = 0;
    if (!point || !artwork.classList.contains('on') || !artwork.naturalWidth) {
      hide();
      return;
    }
    const rect = artwork.getBoundingClientRect();
    const near = point.x >= rect.left - 16 && point.x <= rect.right + 16
      && point.y >= rect.top - 16 && point.y <= rect.bottom + 16;
    if (point.mode === 'mouse' && !near) {
      hide();
      return;
    }
    const nextSource = artwork.currentSrc;
    if (lens.hidden || source !== nextSource) {
      source = nextSource;
      detail.style.backgroundImage = 'url(' + JSON.stringify(source) + ')';
      detail.style.clipPath = getComputedStyle(artwork).clipPath;
      lens.hidden = false;
      radius = lens.offsetWidth / 2;
    }
    const x = bound(point.x - rect.left, 0, rect.width);
    const y = bound(point.y - rect.top, 0, rect.height);
    const lift = radius + 26;
    const aimY = point.mode === 'touch'
      ? point.y + (point.y >= radius + lift + 8 ? -lift : lift)
      : point.y;
    const left = bound(point.x - radius, 8, innerWidth - 2 * radius - 8);
    const top = bound(aimY - radius, 8, innerHeight - 2 * radius - 8);
    detail.style.width = (rect.width * zoom) + 'px';
    detail.style.height = (rect.height * zoom) + 'px';
    detail.style.transform = 'translate(' + (radius - x * zoom) + 'px,' + (radius - y * zoom) + 'px)';
    lens.style.transform = 'translate(' + left + 'px,' + top + 'px)';
  }

  function show(x, y, mode) {
    point = {x, y, mode};
    if (!frame) frame = requestAnimationFrame(render);
  }

  document.addEventListener('pointermove', event => {
    if (event.pointerType === 'mouse') {
      show(event.clientX, event.clientY, 'mouse');
    } else if (event.pointerId === activeTouch) {
      show(event.clientX, event.clientY, 'touch');
    }
  }, {passive:true});
  document.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse') return;
    if (!stage.contains(event.target) || activeTouch !== null) {
      activeTouch = null;
      hide();
      return;
    }
    activeTouch = event.pointerId;
    show(event.clientX, event.clientY, 'touch');
  }, {passive:true});
  document.addEventListener('pointerup', event => {
    if (event.pointerId === activeTouch) activeTouch = null;
  });
  document.addEventListener('pointercancel', event => {
    if (event.pointerId !== activeTouch) return;
    activeTouch = null;
    hide();
  });
  document.documentElement.addEventListener('pointerleave', hide);
  window.addEventListener('resize', hide);
  artwork.addEventListener('blur', () => {
    if (point?.mode === 'keyboard') hide();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') hide();
  });
  artwork.addEventListener('keydown', event => {
    const rect = artwork.getBoundingClientRect();
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (point?.mode === 'keyboard') hide();
      else show(rect.left + rect.width / 2, rect.top + rect.height / 2, 'keyboard');
      return;
    }
    if (point?.mode !== 'keyboard') return;
    const steps = {ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowUp:[0,-20],ArrowDown:[0,20]};
    const step = steps[event.key];
    if (!step) return;
    event.preventDefault();
    show(bound(point.x + step[0], rect.left, rect.right),
      bound(point.y + step[1], rect.top, rect.bottom), 'keyboard');
  });
  new MutationObserver(hide).observe(artwork, {attributes:true, attributeFilter:['src']});
})();
</script>
</body>
</html>
